[package]
name = "herdr-agent-quota"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Credential-scoped AI quota and context in Herdr for Claude, Codex, Grok, Agy, OpenCode, and Pi"
license = "MIT"
readme = "README.md"
repository = "https://github.com/levi-qiao/herdr-agent-quota"
homepage = "https://herdr.dev/plugins/"
keywords = ["herdr", "claude-code", "codex", "quota", "usage"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/screenshots/*", "docs/research/*", "docs/plans/*", ".github/*"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
toml_edit = "0.22"
ureq = { version = "2.12", features = ["json"] }
# Bundled SQLite so macOS/Linux CI does not need libsqlite3 or a sqlite3 binary.
# Used only for exact session-id lookups in OpenCode's local opencode.db.
rusqlite = { version = "0.32.1", features = ["bundled"] }

# Only used to put the Codex app-server in its own process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"

[[bin]]
name = "herdr-agent-quota"
path = "src/main.rs"
