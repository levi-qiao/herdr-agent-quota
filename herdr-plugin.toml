id = "herdr-agent-quota"
name = "Herdr Agent Quota"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Credential-scoped AI quota and context for Claude, Codex, Grok, Agy, OpenCode, and Pi."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[startup]]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-quota\" refresh --provider all"]

[[actions]]
id = "refresh"
title = "Refresh agent quota"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-quota\" refresh --provider all --force"]

[[actions]]
id = "configure"
title = "Install / repair agent quota"
command = ["sh", "-c", "\"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-quota\" configure --apply && herdr server reload-config"]

[[actions]]
id = "uninstall"
title = "Uninstall agent quota configuration"
command = ["sh", "-c", "\"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-quota\" configure --uninstall && herdr server reload-config"]

[[events]]
id = "agent-quota-refresh"
on = "pane.agent_detected"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-quota\" event"]

[[events]]
id = "agent-quota-status-refresh"
on = "pane.agent_status_changed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-quota\" event"]

[[events]]
id = "focused-agent-quota-refresh"
on = "pane.focused"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-quota\" focus"]

[[panes]]
id = "dashboard"
title = "Agent quota"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-agent-quota\" dashboard"]
placement = "popup"
