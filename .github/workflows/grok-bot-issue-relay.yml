name: Grok Bot Issue Relay
on:
  issues:
    types: [opened, edited, reopened, assigned, labeled]
  issue_comment:
    types: [created]
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Forward to Grok Bot
        env:
          WEBHOOK_URL: ${{ secrets.GROK_ISSUE_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_ISSUE_WEBHOOK_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_KEY:-}" ]; then
            echo "Missing GROK_ISSUE_WEBHOOK_URL or GROK_ISSUE_WEBHOOK_KEY" >&2
            exit 1
          fi
          jq -n \
            --argjson event "$(jq -c . "$GITHUB_EVENT_PATH")" \
            --arg event_name "$EVENT_NAME" \
            --arg event_action "$EVENT_ACTION" \
            '{source:"github-actions",event_name:$event_name,event_action:$event_action,event:$event}' \
          | curl -sS -f -X POST "$WEBHOOK_URL" \
              -H "Authorization: Bearer $WEBHOOK_KEY" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: $EVENT_NAME" \
              --data-binary @-